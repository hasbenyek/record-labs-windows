name: macOS build (preview)

# Builds Record Labs for macOS on an Apple Silicon and an Intel runner and
# keeps each .dmg as a workflow artifact (Actions tab > this run > Artifacts).
# It publishes no release and runs only for the macos-port branch or by hand,
# so Windows and Linux releases and their in-app updates are untouched.

on:
  push:
    branches: ['macos-port']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel (GitHub's last Intel image, until fall 2027)
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' build.gradle.kts | tr -d '\r' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Helper programs (yt-dlp, Deno)
        run: bash packaging/macos/fetch-tools.sh

      # Phase 3: VLC is bundled inside the app. The arch-matching VLC.app comes
      # from Homebrew, is copied into src/appResources, and is then removed
      # again so the self-test below can only pass with the bundled copy.
      - name: Bundle VLC into the app
        run: |
          brew install --cask vlc
          bash packaging/macos/bundle-vlc.sh
          brew uninstall --cask vlc
          test ! -e /Applications/VLC.app

      # Diagnosis: streams a real YouTube Music song through the app's own
      # path (stream sources -> local audio proxy -> bundled VLC) on this Mac.
      - name: Real song streaming test (diagnosis)
        continue-on-error: true
        env:
          RECORDLABS_NETWORK_TESTS: '1'
        run: |
          ./gradlew --no-daemon test --tests "com.recordlabs.desktop.data.LinuxYouTubeStreamingTest" || true
          for f in build/test-results/test/*LinuxYouTubeStreaming*.xml; do
            echo "=== $f"; sed -n '1,400p' "$f"
          done

      - name: Build the .dmg
        env:
          LISTEN_TOGETHER_KEY: ${{ secrets.LISTEN_TOGETHER_KEY }}
        run: ./gradlew --no-daemon packageDmg

      - name: Name the .dmg by architecture
        run: |
          dmg="$(find build -name '*.dmg' -path '*dmg*' | head -1)"
          test -n "$dmg"
          mkdir -p out
          cp "$dmg" "out/RecordLabs-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
          ls -la out

      - name: Audio self-test (bundled VLC only, no VLC installed)
        run: |
          app="$(find build -maxdepth 6 -name 'Record Labs.app' -path '*binaries/main/app/*' | head -1)"
          echo "App: $app"
          uname -m
          du -sh "$app"
          out="$("$app/Contents/MacOS/Record Labs" --self-test-audio 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "SELF-TEST PASS: .*Record Labs.app" || { echo "Audio did not come from the bundled VLC"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: out/*.dmg
          compression-level: 0
          if-no-files-found: error
