name: macOS build (testing, no release)

# Builds the Mac app for Apple Silicon and Intel and keeps each .dmg as a workflow
# artifact (Actions > this run > Artifacts). A push only builds. Run by hand with
# "release_tag" (for example v0.1.9), it also adds both .dmg files to that existing
# release: the release's tag, version and Windows / Linux files stay as they are,
# so Windows and Linux users get no update notice from it.
on:
  push:
    branches: ['macos']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to add the .dmg files to (e.g. v0.1.9); empty = build only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Run by hand with release_tag: makes sure the release exists. A new one is made as a
  # draft (notes from packaging/macos/release-notes.md) and published by "publish" below
  # once both .dmg files are in it; an existing release (v0.1.9, say) only gets the files.
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release (draft when new)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          v="$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' build.gradle.kts | tr -d '\r' | head -1)"
          test "${TAG#v}" = "$v" || { echo "::error::Version $v is not $TAG"; exit 1; }
          grep -q "BUILD_VERSION = \"$v\"" shared/src/commonMain/kotlin/com/recordlabs/desktop/data/AppSettings.kt \
            || { echo "::error::AppInfo.BUILD_VERSION is not $v"; exit 1; }
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Record Labs $v (Mac)" --notes-file packaging/macos/release-notes.md
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease

  build:
    needs: prepare
    # Also runs on a push (prepare is then skipped).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' build.gradle.kts | tr -d '\r' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Helper programs (yt-dlp, Deno)
        run: bash packaging/macos/fetch-tools.sh

      - name: Bundle VLC into the app
        run: |
          brew install --cask vlc
          bash packaging/macos/bundle-vlc.sh
          brew uninstall --cask vlc
          test ! -e /Applications/VLC.app

      - name: Build the .dmg
        env:
          LISTEN_TOGETHER_KEY: ${{ secrets.LISTEN_TOGETHER_KEY }}
        # Test builds (a push, or a run without release_tag) keep a performance log in
        # ~/Music/record-labs-perf.txt; the build that goes into a release does not.
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then perf="-Precordlabs.perfLog=true"; else perf=""; fi
          ./gradlew --no-daemon packageDmg $perf

      - name: Name the .dmg by architecture
        run: |
          dmg="$(find build -name '*.dmg' -path '*binaries*' | head -1)"
          test -n "$dmg"
          mkdir -p out
          cp "$dmg" "out/RecordLabs-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"
          (cd out && shasum -a 256 *.dmg | tee "SHA256-${{ matrix.arch }}.txt")
          ls -la out

      # Kept before the checks below, so a failing check still leaves the .dmg to try.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: |
            out/*.dmg
            out/SHA256-*.txt
          compression-level: 0
          if-no-files-found: error

      - name: Audio self-test (bundled VLC only, no VLC installed)
        run: |
          app="$(find build -maxdepth 6 -name 'Record Labs.app' -path '*binaries/main/app/*' | head -1)"
          echo "App: $app"
          uname -m
          du -sh "$app"
          codesign -dv "$app" 2>&1 | head -5 || true
          out="$("$app/Contents/MacOS/Record Labs" --self-test-audio 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "SELF-TEST PASS: .*Record Labs.app" || { echo "Audio did not come from the bundled VLC"; exit 1; }

      - name: Media controls self-test (earphone remote / media keys)
        run: |
          app="$(find build -maxdepth 6 -name 'Record Labs.app' -path '*binaries/main/app/*' | head -1)"
          out="$("$app/Contents/MacOS/Record Labs" --self-test-media 2>&1)" || { echo "$out"; exit 1; }
          echo "$out" | grep "MEDIA-TEST"
          echo "$out" | grep -q "MEDIA-TEST PASS"

      - name: Login browser check (diagnosis)
        continue-on-error: true
        run: |
          app="$(find build -maxdepth 6 -name 'Record Labs.app' -path '*binaries/main/app/*' | head -1)"
          "$app/Contents/MacOS/Record Labs" --self-test-login 2>&1 | tail -20

      # Only when run by hand with release_tag, and only after the checks above passed.
      - name: Add the .dmg to the existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          # The app's version must be the release's (v0.1.9 takes a 0.1.9 build).
          test "${TAG#v}" = "${{ steps.version.outputs.version }}" || { echo "Version ${{ steps.version.outputs.version }} is not $TAG"; exit 1; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "out/RecordLabs-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

  # Publishes a release this workflow made as a draft, once both .dmg files are in it.
  # Not marked "Latest", so the release page keeps pointing at the Windows / Linux one.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          assets="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "Files: $assets"
          case "$assets" in *-arm64.dmg*) ;; *) echo "::error::No arm64 .dmg"; exit 1;; esac
          case "$assets" in *-x64.dmg*) ;; *) echo "::error::No x64 .dmg"; exit 1;; esac
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
