name: Linux packages

# Builds the Linux installers (.deb, .rpm, AppImage, Arch tarball + PKGBUILD),
# tests each one in a clean container of the target distributions, and
# attaches them to the GitHub release when a version tag (v1.2.3) is pushed.
# Windows installers are still built and uploaded the usual way; both sets of
# files can sit in the same release because each app only looks for its own.

on:
  push:
    tags: ['v*']
    # Builds and tests (no release) while the Linux port is being reviewed.
    branches: ['linux-port']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 22.04: the bundled libraries then need only glibc 2.35, older than
    # every supported distribution.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libvlc-dev vlc-plugin-base vlc-plugin-video-output patchelf rpm fakeroot xz-utils curl unzip
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # AppImages need FUSE to run; extract-and-run works without it.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts | tr -d '\r' | head -1)"
          # The app compares its own version (from build.gradle.kts / AppInfo)
          # with the release tag, so they must match or it would always see an update.
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match version $v in build.gradle.kts"; exit 1
          fi
          grep -q "BUILD_VERSION = \"$v\"" src/main/kotlin/com/recordlabs/desktop/data/AppSettings.kt \
            || { echo "::error::AppInfo.BUILD_VERSION in AppSettings.kt is not $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          LISTEN_TOGETHER_KEY: ${{ secrets.LISTEN_TOGETHER_KEY }}
        run: packaging/linux/build-all.sh "${{ steps.version.outputs.version }}"

      - name: Unit tests (audio through libVLC, Linux updater, Deno daemon)
        run: ./gradlew --no-daemon test --tests "com.recordlabs.desktop.data.LinuxVlcPlaybackTest" --tests "com.recordlabs.desktop.data.AppUpdaterLinuxTest" --tests "com.recordlabs.desktop.data.LinuxDenoCipherDaemonTest"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: build/linux-packages/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04',        package: 'record-labs_*_amd64.deb' }
          - { image: 'ubuntu:24.04',        package: 'record-labs_*_amd64.deb' }
          - { image: 'debian:12',           package: 'record-labs_*_amd64.deb' }
          - { image: 'fedora:42',           package: 'record-labs-*.x86_64.rpm' }
          - { image: 'opensuse/tumbleweed', package: 'record-labs-*.x86_64.rpm' }
          - { image: 'opensuse/leap:15.6',  package: 'record-labs-*.x86_64.rpm' }
          - { image: 'archlinux:latest',    package: 'record-labs-*-linux-x86_64.tar.xz' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: packages
      - name: Install and run in ${{ matrix.image }}
        run: packaging/linux/test-install.sh "${{ matrix.image }}" packages/${{ matrix.package }} --gui

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: packages
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Record Labs ${TAG#v}" --notes "Record Labs ${TAG#v}"
          gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
